name: Go CI
on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "eventbus/nats/**"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Allow go.mod's RC toolchain
        # go.mod requires 1.27rc1, which setup-go's manifests don't reliably
        # resolve — so we install a stable Go and let the go command download
        # the exact toolchain go.mod names, mirroring local development.
        # setup-go exports GOTOOLCHAIN=local (which overrides workflow-level
        # env), so auto must be re-exported after it.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Check go.mod tidiness
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Check formatting
        # Must be the toolchain's own gofmt: older gofmt binaries false-positive
        # on the generic methods the builder API uses.
        run: |
          unformatted="$($(go env GOROOT)/bin/gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # The race detector is load-bearing here — it has caught real
        # coordination bugs the plain suite missed.
        run: go test -race ./...

  # The live tests (TestLive*) run the object backend against a real
  # S3-compatible server instead of the in-process fake, where every operation
  # answers instantly and the gaps a multi-object write opens — a START's lock
  # landing four objects before its manifest — close too fast to observe. They
  # skip themselves when FSM_TEST_S3_ENDPOINT is unset, so without this job
  # nothing would ever run them.
  #
  # Pinned to an exact release rather than a moving tag: a store swap changes
  # what the tests mean, so it should be a change here, not a silent one.
  object-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Allow go.mod's RC toolchain
        # See the root job: GOTOOLCHAIN=auto must be re-exported after setup-go.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Start the object store
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 \
            -e RUSTFS_ACCESS_KEY=minioadmin \
            -e RUSTFS_SECRET_KEY=minioadmin \
            rustfs/rustfs:1.0.0 server /data
      - name: Wait for the object store
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9000/health && exit 0
            sleep 1
          done
          echo "::error::the object store never became ready"
          docker logs rustfs 2>&1 | tail -40
          exit 1
      - name: Test against the object store
        env:
          FSM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
        # -count=1 so a cached pass from the fake-backed job cannot stand in for
        # a run against the real store.
        run: go test -race -count=1 -run TestLive ./...

  # The NATS EventBus adapter (eventbus/nats) is a nested module so nats.go stays
  # out of the core module's dependency graph — the root job's ./... never descends
  # into it, hence this separate job rather than a matrix entry (a matrix would
  # rename the root "go" status check and could break branch protection). It
  # replaces the core module with ../.. and compiles it (generic methods), so it
  # mirrors the root job's RC-toolchain bootstrap and checks.
  eventbus-nats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eventbus/nats
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Allow go.mod's RC toolchain
        # See the root job: GOTOOLCHAIN=auto must be re-exported after setup-go so
        # the go command downloads the RC toolchain go.mod names.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - name: Check go.mod tidiness
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Check formatting
        run: |
          unformatted="$($(go env GOROOT)/bin/gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
